<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>ATL2-R01 Three.js inventory-style measure</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f172a;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="host" data-atl2-r01-variant="three-inventory"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';

      const host = document.getElementById('host');
      const fixture = await fetch('./fixture.json').then((r) => r.json());

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1));
      renderer.setSize(1280, 720);
      host.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const sun = new THREE.DirectionalLight(0xfff1d6, 1.05);
      sun.position.set(-40, 80, -20);
      scene.add(sun);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(220, 64),
        new THREE.MeshStandardMaterial({ color: 0x1a3a2a }),
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      for (const o of fixture.objects) {
        const h = Math.max(0.5, Number(o.h) || 2);
        const s = Math.max(0.5, Number(o.size) || 2);
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(s, h, s * (o.type === 'haus' ? 0.9 : 1)),
          new THREE.MeshStandardMaterial({
            color: o.type === 'baum' ? 0x2f6b4f : o.type === 'stein' ? 0x8a8a8a : 0xb07a5a,
          }),
        );
        mesh.position.set(Number(o.x) || 0, h / 2, Number(o.z) || 0);
        scene.add(mesh);
      }

      const camera = new THREE.PerspectiveCamera(48, 1280 / 720, 0.1, 5000);
      camera.position.set(80, 90, 120);
      camera.lookAt(0, 0, 0);

      let yaw = 0;
      function draw() {
        yaw += 0.01;
        camera.position.x = Math.cos(yaw) * 140;
        camera.position.z = Math.sin(yaw) * 140;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
      }

      function percentile(sorted, p) {
        if (!sorted.length) return null;
        const i = Math.min(sorted.length - 1, Math.max(0, Math.ceil((p / 100) * sorted.length) - 1));
        return sorted[i];
      }

      window.__r01Measure = async function r01Measure() {
        const samples = [];
        for (let i = 0; i < 10; i++) {
          draw();
          await new Promise((r) => requestAnimationFrame(r));
        }
        for (let i = 0; i < 45; i++) {
          const t0 = performance.now();
          draw();
          await new Promise((r) => requestAnimationFrame(r));
          samples.push(performance.now() - t0);
        }
        const sorted = [...samples].sort((a, b) => a - b);
        const mem = performance.memory
          ? { usedJSHeapMb: +(performance.memory.usedJSHeapSize / 1048576).toFixed(2) }
          : null;
        return {
          variant: 'three-inventory-prototype',
          logicalOk: fixture.objects.length === 8 && host.querySelector('canvas') != null,
          frame: {
            samples: samples.length,
            p50Ms: +percentile(sorted, 50).toFixed(3),
            p95Ms: +percentile(sorted, 95).toFixed(3),
            medianMs: +percentile(sorted, 50).toFixed(3),
          },
          memory: mem,
          hasSoftwareFallbackPath: false,
          notes: 'Inventory-style Three scene (SpatialViewport-class geometry); not product chrome',
        };
      };

      window.__r01Ready = true;
    </script>
  </body>
</html>
