# ECC merge gate policy — machine-enforced companions live in
# scripts/ecc-merge-gate-check.mjs + scripts/kodus-merge-gate.mjs +
# .github/workflows/ecc-merge-gate.yml and the repository ruleset
# "ECC required checks".
mergeStrategy: squash
deleteBranchAfterMerge: true
requireHumanApproval: false
allowDraftMerge: false
cloudDeployAfterMerge: false

# Required status check names (must match GitHub check run names).
# Kodus is enforced inside ECC Merge Gate (requireKodusReview) — do NOT list
# "Kody Code Review" here until a ruleset change is explicitly approved after
# positive+negative gate proof; embedding avoids a second required-check race.
requiredChecks:
  - Test Gate
  - Composition Gate
  - ECC Merge Gate
  - Actual RLS regression canary
  - RPC source regeneration and migration contracts
  - Browser E2E

# Ambient known-red migration baselines are NOT merge-blocking unless listed above.
# Unresolved Codex/Bugbot P1/P2 review findings always block (see ecc-merge-gate-check).
#
# #937 fail-closed review race: workflow re-runs on pull_request_review and
# pull_request_review_comment so a late P1/P2 on an unchanged HEAD replaces a
# prior green ECC Merge Gate with FAIL. GraphQL reviewThreads.isResolved is
# authoritative; API errors and pending reviews for the current HEAD → FAIL.
# Do not weaken severity thresholds or skip findings evaluation to unblock merges.
#
# Kodus (kody-ai): requireKodusReview=true → HEAD must have a completed success
# "Kody Code Review" check-run from app slug kody-ai with a Complete title
# (or APPROVED/COMMENTED review fallback when GitHub overwrites the check to skipped).
# "Code Review Started" is never PASS. New pushes invalidate prior HEAD approval.
# Evaluate polls Kodus (ECC_KODUS_MAX_WAIT_MS / ECC_KODUS_POLL_MS) so the first
# PR-triggered run does not sticky-fail while Kody is still in_progress.
# Severity badges severity_level-{critical|high|medium|low|info} block until
# resolved or dismissed (<!-- ecc-finding-dismissed: … -->).

requireKodusReview: true

blockOnUnresolvedReviewSeverities:
  - P1
  - P2
  - Critical
  - Important
  - High
  - Medium
  - Low
  - Info

requireCompositionProofFresh: true
requireEccCheckReadyEvidence: false # agent-local; CI enforces checks + review findings
