# ECC merge gate policy — machine-enforced companions live in
# scripts/ecc-merge-gate-check.mjs + .github/workflows/ecc-merge-gate.yml
# and the repository ruleset "ECC required checks".
mergeStrategy: squash
deleteBranchAfterMerge: true
requireHumanApproval: false
allowDraftMerge: false
cloudDeployAfterMerge: false

# Required status check names (must match GitHub check run names).
requiredChecks:
  - Test Gate
  - Composition Gate
  - ECC Merge Gate
  - Actual RLS regression canary
  - RPC source regeneration and migration contracts
  - Browser E2E

# Ambient known-red migration baselines are NOT merge-blocking unless listed above.
# Unresolved Codex/Bugbot P1/P2 review findings always block (see ecc-merge-gate-check).
#
# #937 fail-closed review race: workflow re-runs on pull_request_review and
# pull_request_review_comment so a late P1/P2 on an unchanged HEAD replaces a
# prior green ECC Merge Gate with FAIL. GraphQL reviewThreads.isResolved is
# authoritative; API errors and pending reviews for the current HEAD → FAIL.
# Do not weaken severity thresholds or skip findings evaluation to unblock merges.

blockOnUnresolvedReviewSeverities:
  - P1
  - P2
  - Critical
  - Important

requireCompositionProofFresh: true
requireEccCheckReadyEvidence: false # agent-local; CI enforces checks + review findings
