_format_version: '2.1'

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${SUPABASE_ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SUPABASE_SERVICE_ROLE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1
    plugins:
      - name: cors
      # #670: IP-keyed throttle on login/signup/token (fail closed at gateway)
      - name: rate-limiting
        config:
          minute: 30
          policy: local
          fault_tolerant: false
          hide_client_headers: false

  - name: rest-v1
    url: http://supabase-rest:3000
    routes:
      - name: rest-v1-route
        paths:
          - /rest/v1
    plugins:
      - name: cors

  - name: storage-v1
    url: http://supabase-storage:5000
    routes:
      - name: storage-v1-route
        paths:
          - /storage/v1
    plugins:
      - name: cors

  # Upstream Phoenix socket is /socket — strip /realtime/v1 so
  # /realtime/v1/websocket → /socket/websocket (#604).
  - name: realtime-v1
    url: http://supabase-realtime:4000/socket
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  - name: functions-v1
    url: http://supabase-edge:9998
    routes:
      - name: functions-v1-route
        paths:
          - /functions/v1
        strip_path: true
    plugins:
      - name: cors

  - name: meta-v1
    url: http://supabase-meta:8080
    routes:
      - name: meta-v1-route
        paths:
          - /meta/v1